[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "crittervid"
dynamic = ["version"]
description = "Converts camera-trap SD cards into MP4 files, merges them into days and checks the results"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
# The pipeline needs only the standard library (and FFmpeg)
dependencies = []

[project.optional-dependencies]
gui = ["streamlit==1.50.0"]
gpu = [
    "GPUtil==1.4.0",
    'WMI==1.5.1; sys_platform == "win32"',
]
dev = [
    "pyinstaller==6.11.1",
    "pytest==9.1.1",
]

[tool.setuptools.dynamic]
version = {attr = "crittervid.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
