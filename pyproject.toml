[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "crittervid"
dynamic = ["version"]
description = "Converts camera-trap SD cards into MP4 files, merges them into days and checks the results"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
# The pipeline needs only the standard library (and FFmpeg), plus the time zone
# data, which Windows and some containers don't have (decision record 0005)
dependencies = ["tzdata>=2025.2"]   # a floor, not a pin: newer data has the latest rules

[project.optional-dependencies]
gui = ["streamlit==1.50.0"]
dev = [
    "pyinstaller==6.11.1",
    "pytest==9.1.1",
]

[project.scripts]
crittervid = "crittervid.cli:main"

[tool.setuptools.dynamic]
version = {attr = "crittervid.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
