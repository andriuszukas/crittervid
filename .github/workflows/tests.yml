name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        # 3.10 is the oldest Python pytest 9 supports; 3.13 is what the .exe ships
        python: ['3.10', '3.13']
    env:
      # Fail rather than skip the FFmpeg and GUI tests if a dependency didn't install
      CRITTERVID_REQUIRE_DEPS: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # A pinned build from GitHub (gyan.dev's, with libx264 for the test
      # fixtures); Chocolatey only if that download fails, as its feed has at
      # times not had the package
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          try {
            Invoke-WebRequest $url -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 10
            Expand-Archive $zip -DestinationPath $dir
            $bin = (Get-ChildItem $dir -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
            Add-Content $env:GITHUB_PATH $bin
          } catch {
            Write-Warning "Download failed ($_); installing from Chocolatey instead"
            choco install ffmpeg -y --no-progress
          }

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Check FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      # Installing everything on every OS also checks that the requirements
      # install there
      - name: Install requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v
